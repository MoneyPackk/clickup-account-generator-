version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: clickup-generator:latest
    container_name: clickup_generator_app
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql://clickup_user:clickup_pass@db:5432/clickup_generator
      LOG_LEVEL: INFO
      JSON_LOGGING: "true"
      METRICS_ENABLED: "true"
      PROMETHEUS_PORT: "8000"
      CLICKUP_HEADLESS: "true"
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_WINDOW: "3600"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    container_name: clickup_generator_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: clickup_user
      POSTGRES_PASSWORD: clickup_pass
      POSTGRES_DB: clickup_generator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clickup_user -d clickup_generator"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:latest
    container_name: clickup_generator_prometheus
    restart: unless-stopped
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    profiles:
      - monitoring

volumes:
  postgres_data:
